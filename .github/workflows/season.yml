name: Record season salting
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: season
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update_season.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/season.json data/local)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/season.json data/local
            git commit -m "Update season salting record"
            git push
          fi
